server:
  port: 8087

spring:
  application:
    name: biller
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/payments}
    username: ${DB_USER:payments}
    password: ${DB_PASSWORD:payments}
    # search_path соединения — своя схема (создаётся в infra/postgres/init.sql)
    hikari:
      schema: biller
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:29092}
    consumer:
      group-id: biller
      auto-offset-reset: earliest
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    default-schema: biller
    liquibase-schema: biller

# Интеграции с поставщиками (пока — заглушки в сервисе providers)
integrations:
  gis-gmp:
    url: ${GIS_GMP_URL:http://localhost:8088}
  # Шлюзы поставщиков: связь, транспорт, игры
  gateway:
    url: ${GATEWAY_URL:http://localhost:8088}
